<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}

<title>Lumen Wallet</title>

<style>
/* Layout: single phone column — card hero, two stat tiles, grouped transaction list, bottom sheets */
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#1c1c1e;
  --surface-2:#2a2a2d;
  --line:#38383b;
  --fg:#f5f5f7;
  --muted:#8e8e93;
  --accent:#b9a7ff;
  --danger:#ff6961;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:flex-end;align-items:center}
.round{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px}
.pill button{height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.pill button:hover{background:var(--surface-2)}
.proto{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Cards */
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-4px;padding:4px}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;aspect-ratio:1.586;max-width:100%;border-radius:18px;scroll-snap-align:center;position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 40px rgba(255,255,255,.06)}
.card.titanium{background:linear-gradient(135deg,#fdfdfd,#e9e9ec 55%,#f7f7f8);color:#8a8a90}
.card.graphite{background:linear-gradient(135deg,#3a3a3f,#1f1f22 60%,#2e2e33);color:#a8a8b0}
.card.lilac{background:linear-gradient(135deg,#cbbcff,#9c86f2 60%,#b8a6ff);color:#fff}
.card.ember{background:linear-gradient(135deg,#ff9a6b,#e5603c 60%,#f58457);color:#fff}
.card .mark{width:46px;height:46px}
.card .mark.apple{width:34px;height:40px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 .5px,rgba(0,0,0,.035) .5px 1px,transparent 1px 1.5px),linear-gradient(150deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,0) 60%),linear-gradient(160deg,#ececf0,#a8a8b0 42%,#d4d4da 62%,#8a8a92);-webkit-mask:url(apple-mark.png) center/contain no-repeat;mask:url(apple-mark.png) center/contain no-repeat}
.card .netmark{width:62px;height:38px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 .5px,rgba(0,0,0,.035) .5px 1px,transparent 1px 1.5px),linear-gradient(150deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,0) 60%),linear-gradient(160deg,#ececf0,#a8a8b0 42%,#d4d4da 62%,#8a8a92);-webkit-mask:url(mastercard-outline.png) center/contain no-repeat;mask:url(mastercard-outline.png) center/contain no-repeat}
.card .row{display:flex;justify-content:space-between;align-items:flex-end}
.card .name{font-weight:700;font-size:15px;letter-spacing:.02em}
.card .num{font-size:13px;letter-spacing:.14em;font-variant-numeric:tabular-nums;opacity:.85}
.net{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;letter-spacing:.32em;font-weight:500;text-transform:lowercase;padding-left:.32em}
.card.titanium .net{color:#9a9aa1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.9))}
.dots{display:flex;justify-content:center;gap:6px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--fg)}

/* Tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:24px;padding:18px;min-width:0;min-height:150px;display:flex;flex-direction:column;gap:4px}
.tile h3{margin:0;font-size:15px;font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
.bars{display:flex;gap:7px;align-items:flex-end;flex:1;margin-top:10px;height:60px}
.bars i{flex:1;border-radius:6px;background:var(--surface-2);min-height:8px;position:relative}
.bars i b{position:absolute;inset:auto 0 0 0;border-radius:6px;background:var(--accent)}

/* List */
.listhead{display:flex;justify-content:space-between;align-items:center}
.listhead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.list{background:var(--surface);border-radius:24px;overflow:hidden}
.tx{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 0;width:100%;text-align:left}
.tx:hover{background:#232326}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.txbody{flex:1;min-width:0;padding-bottom:16px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.tx:last-child .txbody{border-bottom:0}
.txmain{flex:1;min-width:0}
.txmain strong{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txmain span{display:block;color:var(--muted);font-size:14px}
.txamt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.badge{font-size:12px;background:var(--surface-2);color:#c7c7cc;padding:2px 7px;border-radius:6px;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:calc(max(20px,env(safe-area-inset-right,0px)));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--fg);color:#000;font-size:30px;font-weight:500;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0;font-size:20px;font-weight:800}
.sheethead{display:flex;justify-content:space-between;align-items:center}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.primary{background:var(--fg);color:#000;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.ghost{background:var(--surface-2);border-radius:14px;padding:14px;font-weight:700}
.del{color:var(--danger)}
.swatches{display:flex;gap:10px}
.swatches button{width:44px;height:30px;border-radius:7px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.detail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.detail .ico{width:64px;height:64px;font-size:28px;border-radius:16px}
.detail .big{font-size:40px}
.kv{background:var(--surface-2);border-radius:14px}
.kv div{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* Cardholder */
.holder{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.holder .hrow{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#cbbcff,#9c86f2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.holder .who{flex:1;min-width:0}
.holder .who strong{display:block;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holder .who span{color:var(--muted);font-size:14px}
.edit{background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.edit:hover{background:var(--line)}
.card .holdername{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:4px}


/* Info page */
.top{min-height:52px}
.page{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:pagein .45s cubic-bezier(.2,.9,.25,1)}
.page.leaving{animation:pageout .32s ease forwards}
@keyframes pagein{from{transform:translateX(100%)}}
@keyframes pageout{to{transform:translateX(100%)}}
.app.behind{transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .45s;transform:translateX(-18%);opacity:.4}
.app{transition:transform .35s ease,opacity .35s}
.pagebar{max-width:440px;margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pagebar h2{margin:0;font-size:18px;font-weight:700}
.pagebody{max-width:440px;margin:20px auto 0;display:flex;flex-direction:column;gap:12px}
.pagebody .card{width:100%}
.sect{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px;padding-left:4px}
.reveal{background:none;color:var(--accent);font-weight:700;font-size:14px;padding:0}

/* Motion */
.card{transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.card::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-60%);animation:sheen 7s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sheen{0%,70%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.card.press{transform:scale(.975)}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}}
.bars i b{transition:height .9s cubic-bezier(.2,.8,.2,1)}
.tx{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.tx.out{animation:out .35s ease forwards}
@keyframes out{to{opacity:0;transform:translateX(30px)}}
.scrim{animation:fade .3s ease both}
.scrim.closing{animation:fadeout .28s ease forwards}
.scrim.closing .sheet{animation:down .28s ease forwards}
@keyframes fade{from{background:rgba(0,0,0,0)}}
@keyframes fadeout{to{background:rgba(0,0,0,0)}}
.sheet{animation:up .45s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.fab{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fab:active,.round:active,.pill button:active,.edit:active,.primary:active{transform:scale(.94)}
.round,.pill button,.edit,.primary{transition:transform .2s,background .2s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <div class="top">
    <div class="pill">
      <button id="infoBtn" aria-label="Card and cardholder information"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M6 15h3M12 15h2"/><circle cx="16.5" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg></button>
      <button id="addCardBtn" aria-label="Add card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <div class="cards rise" id="cards"></div>
  <div class="dots" id="dots"></div>

  <div class="tiles rise" style="animation-delay:.08s">
    <div class="tile"><h3 id="monthLabel">Spending</h3><div class="big" id="monthTotal">$0.00</div></div>
    <div class="tile"><h3>Weekly Activity</h3><div class="sub" style="font-variant-numeric:tabular-nums">+<span id="cashAmt">$0.00</span> Daily Cash</div><div class="bars" id="bars"></div></div>
  </div>

  <div class="listhead"><h2>Latest Transactions</h2></div>
  <div class="list" id="list"></div>
</div>

<section class="page" id="infoPage" hidden aria-label="Card information">
  <div class="pagebar"><button class="round" id="backBtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Card Information</h2><span style="width:52px"></span></div>
  <div class="pagebody">
    <div id="miniCard"></div>
    <div class="sect">Card</div>
    <div class="kv" id="cInfo"></div>
    <div class="sect">Cardholder</div>
    <div class="holder">
      <div class="hrow"><div class="avatar" id="hAvatar"></div><div class="who"><strong id="hName"></strong><span id="hSince"></span></div><button class="edit" id="hEdit">Edit</button></div>
      <div class="kv" id="hInfo"></div>
    </div>
    <button class="ghost del" id="rmCard">Remove This Card</button>
  </div>
</section>

<button class="fab" id="fab" aria-label="Add transaction">+</button>
<div id="sheetRoot"></div>

<script>
const PALETTE=["#e5603c","#9c86f2","#d63b5c","#2f9e6e","#3a7bd5","#c08a2e","#5a5a62","#1d1d1f"];
const FINISHES={titanium:"Titanium",graphite:"Graphite",lilac:"Lilac",ember:"Ember"};
const fmt=n=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=d=>{const t=new Date();t.setDate(t.getDate()-d);return t.toISOString().slice(0,10)};

function seed(){
  const c1=uid(),c2=uid();
  return {active:c1,cards:[
    {id:c1,name:"Lumen Card",finish:"titanium",last4:"4821"},
    {id:c2,name:"Lumen Night",finish:"graphite",last4:"0937"}],
   tx:[
    {id:uid(),card:c1,merchant:"Northwind Coffee",amount:6.40,date:daysAgo(1),method:"Tap to Pay",cash:2,color:"#c08a2e"},
    {id:uid(),card:c1,merchant:"Atlas Books",amount:32.15,date:daysAgo(3),method:"Card Number Used",cash:1,color:"#3a7bd5"},
    {id:uid(),card:c1,merchant:"Orbit Mobile",amount:21.32,date:daysAgo(9),method:"Card Number Used",cash:1,color:"#9c86f2"},
    {id:uid(),card:c1,merchant:"Harbor Market",amount:47.98,date:daysAgo(14),method:"Tap to Pay",cash:2,color:"#2f9e6e"}]};
}
let S;
try{S=JSON.parse(localStorage.getItem("lumen-wallet"))}catch(e){}
if(!S||!S.cards||!S.cards.length)S=seed();
if(!S.holder)S.holder={name:"Alex Morgan",email:"alex@example.com",phone:"+1 555 0142",address:"128 Harbor Lane, Springfield",since:"2024"};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const counters={};
function countTo(el,to,prefix=""){
  const from=counters[el.id]??0;counters[el.id]=to;
  if(reduce||from===to){el.textContent=prefix+fmt(to);return}
  const t0=performance.now(),d=900;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=prefix+fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
function renderHolder(){
  const h=S.holder;
  hAvatar.textContent=initials(h.name);hName.textContent=h.name;hSince.textContent="Member since "+h.since;
  hInfo.innerHTML=[["Email",h.email],["Phone",h.phone],["Billing Address",h.address]].map(([k,v])=>`<div><span>${k}</span><b>${esc(v||"—")}</b></div>`).join("");
  document.querySelectorAll(".card .holdername").forEach(e=>e.textContent=h.name);
}
const save=()=>{try{localStorage.setItem("lumen-wallet",JSON.stringify(S))}catch(e){}};

const mark=`<div class="mark apple" role="img" aria-label="Apple"></div>`;
const net=`<div class="net"><div class="netmark" role="img" aria-label="Mastercard"></div></div>`;

function renderCards(){
  const el=document.getElementById("cards");
  el.innerHTML=S.cards.map(c=>`<div class="card ${c.finish}" data-id="${c.id}">${mark}<div class="row"><div><div class="holdername">${esc(S.holder.name)}</div><div class="name">${esc(c.name)}</div><div class="num">•••• ${esc(c.last4)}</div></div>${net}</div></div>`).join("");
  const idx=Math.max(0,S.cards.findIndex(c=>c.id===S.active));
  requestAnimationFrame(()=>{el.scrollLeft=idx*(el.clientWidth+14)});
  renderDots();
}
function renderDots(){
  document.getElementById("dots").innerHTML=S.cards.length>1?S.cards.map(c=>`<span class="${c.id===S.active?"on":""}"></span>`).join(""):"";
}
document.getElementById("cards").addEventListener("scroll",e=>{
  const el=e.target,i=Math.round(el.scrollLeft/(el.clientWidth+14));
  const c=S.cards[i];if(c&&c.id!==S.active){S.active=c.id;save();renderDots();renderData()}
},{passive:true});

function renderData(){
  const txs=S.tx.filter(t=>t.card===S.active).sort((a,b)=>b.date.localeCompare(a.date));
  const now=new Date(),ym=now.toISOString().slice(0,7);
  document.getElementById("monthLabel").textContent=now.toLocaleString("en-US",{month:"long"})+" Spending";
  countTo(document.getElementById("monthTotal"),txs.filter(t=>t.date.startsWith(ym)).reduce((s,t)=>s+ +t.amount,0));
  const days=[...Array(7)].map((_,i)=>daysAgo(6-i));
  const per=days.map(d=>txs.filter(t=>t.date===d).reduce((s,t)=>s+ +t.amount,0));
  const max=Math.max(...per,1);
  const cash=txs.filter(t=>days.includes(t.date)).reduce((s,t)=>s+t.amount*t.cash/100,0);
  countTo(document.getElementById("cashAmt"),cash);
  const bars=document.getElementById("bars");
  if(bars.children.length!==7)bars.innerHTML=per.map(()=>`<i><b style="height:0%"></b></i>`).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>per.forEach((v,i)=>{const b=bars.children[i].firstChild;b.style.transitionDelay=(i*50)+"ms";b.style.height=(v?Math.max(12,v/max*100):0)+"%"})));
  const list=document.getElementById("list");
  list.innerHTML=txs.length?txs.map((t,i)=>`<button class="tx" data-id="${t.id}" style="animation-delay:${.25+i*.05}s"><div class="ico" style="background:${t.color}">${esc(t.merchant.trim()[0]||"?").toUpperCase()}</div><div class="txbody"><div class="txmain"><strong>${esc(t.merchant)}</strong><span>${esc(t.method)}</span><span>${new Date(t.date+"T12:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"})}</span></div><div class="txamt">${fmt(t.amount)}<span class="badge">${t.cash}%</span></div></div></button>`).join(""):`<div class="empty">No transactions on this card yet. Tap + to add one.</div>`;
}
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".tx");if(b)openDetail(b.dataset.id)});

const root=document.getElementById("sheetRoot");
function sheet(html){
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  const f=root.querySelector("input");if(f)f.focus();
}
function close(after){
  const s=document.getElementById("scrim");
  const done=()=>{root.innerHTML="";if(typeof after==="function")after()};
  if(!s){done();return}
  if(reduce){done();return}
  s.classList.add("closing");setTimeout(done,270);
}
function openHolder(){
  const h=S.holder;
  sheet(`<div class="sheethead"><h2>Cardholder Information</h2><button class="sub" id="x">Cancel</button></div>
  <form id="f" style="display:flex;flex-direction:column;gap:14px">
    <label>Full name<input id="hn" required maxlength="32" value="${esc(h.name)}"></label>
    <label>Email<input id="he" type="email" maxlength="60" value="${esc(h.email)}"></label>
    <div class="two"><label>Phone<input id="hp" type="tel" maxlength="24" value="${esc(h.phone)}"></label>
    <label>Member since<input id="hs" maxlength="4" inputmode="numeric" value="${esc(h.since)}"></label></div>
    <label>Billing address<input id="ha" maxlength="80" value="${esc(h.address)}"></label>
    <button class="primary" type="submit">Save</button>
  </form>`);
  document.getElementById("x").onclick=()=>close();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    S.holder={name:hn.value.trim(),email:he.value.trim(),phone:hp.value.trim(),address:ha.value.trim(),since:hs.value.trim()};
    save();close(()=>{renderHolder();renderInfo()})};
}
document.getElementById("hEdit").onclick=openHolder;
document.getElementById("cards").addEventListener("pointerdown",e=>{const c=e.target.closest(".card");if(c)c.classList.add("press")});
["pointerup","pointercancel","pointerleave"].forEach(ev=>document.getElementById("cards").addEventListener(ev,()=>document.querySelectorAll(".card.press").forEach(c=>c.classList.remove("press"))));
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function openAddTx(){
  sheet(`<div class="sheethead"><h2>New Transaction</h2><button class="sub" id="x">Cancel</button></div>
  <form id="f" style="display:flex;flex-direction:column;gap:14px">
    <label>Merchant<input id="m" required maxlength="40" placeholder="Store name"></label>
    <div class="two"><label>Amount<input id="a" required type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></label>
    <label>Date<input id="d" type="date" value="${today()}" required></label></div>
    <div class="two"><label>Method<select id="me"><option>Tap to Pay</option><option>Card Number Used</option><option>In-App</option></select></label>
    <label>Daily Cash<select id="c"><option value="1">1%</option><option value="2" selected>2%</option><option value="3">3%</option></select></label></div>
    <label>Icon color<div class="swatches" id="sw">${PALETTE.map((p,i)=>`<button type="button" data-c="${p}" aria-pressed="${i===0}" style="background:${p}" aria-label="Color ${i+1}"></button>`).join("")}</div></label>
    <button class="primary" type="submit">Add Transaction</button>
  </form>`);
  let color=PALETTE[0];
  document.getElementById("x").onclick=close;
  document.getElementById("sw").onclick=e=>{const b=e.target.closest("button");if(!b)return;color=b.dataset.c;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",x===b))};
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    S.tx.push({id:uid(),card:S.active,merchant:m.value.trim(),amount:parseFloat(a.value)||0,date:d.value,method:me.value,cash:+c.value,color});
    save();close();renderData()};
}
function openDetail(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  const card=S.cards.find(c=>c.id===t.card);
  sheet(`<div class="sheethead"><span></span><button class="sub" id="x">Done</button></div>
  <div class="detail"><div class="ico" style="background:${t.color}">${esc(t.merchant[0]||"?").toUpperCase()}</div><strong style="font-size:20px">${esc(t.merchant)}</strong><div class="big">${fmt(t.amount)}</div><span class="sub">${new Date(t.date+"T12:00").toLocaleDateString("en-US",{dateStyle:"long"})}</span></div>
  <div class="kv"><div><span>Card</span>${esc(card?card.name:"")} •••• ${esc(card?card.last4:"")}</div><div><span>Method</span>${esc(t.method)}</div><div><span>Daily Cash</span>${t.cash}% · ${fmt(t.amount*t.cash/100)}</div></div>
  <button class="ghost del" id="del">Delete Transaction</button>`);
  document.getElementById("x").onclick=close;
  document.getElementById("del").onclick=()=>{S.tx=S.tx.filter(x=>x.id!==id);save();
    close(()=>{const row=document.querySelector(`.tx[data-id="${id}"]`);if(row&&!reduce){row.style.animationDelay="0s";row.classList.add("out");setTimeout(renderData,330)}else renderData()})};
}
function openAddCard(){
  sheet(`<div class="sheethead"><h2>Add Card</h2><button class="sub" id="x">Cancel</button></div>
  <form id="f" style="display:flex;flex-direction:column;gap:14px">
    <label>Card name<input id="n" required maxlength="24" value="Lumen Card"></label>
    <div class="two"><label>Last 4 digits<input id="l" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric" placeholder="1234"></label>
    <label>Finish<select id="fi">${Object.entries(FINISHES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label></div>
    <button class="primary" type="submit">Add Card</button>
  </form>`);
  document.getElementById("x").onclick=close;
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const id=uid();
    S.cards.push({id,name:n.value.trim(),finish:fi.value,last4:l.value});S.active=id;save();close();renderCards();renderData()};
}
document.getElementById("fab").onclick=openAddTx;
document.getElementById("addCardBtn").onclick=openAddCard;
const appEl=document.querySelector(".app");
function renderInfo(){
  const c=S.cards.find(x=>x.id===S.active)||S.cards[0];
  const txs=S.tx.filter(t=>t.card===c.id);
  const spent=txs.reduce((s,t)=>s+ +t.amount,0),cash=txs.reduce((s,t)=>s+t.amount*t.cash/100,0);
  miniCard.innerHTML=`<div class="card ${c.finish}">${mark}<div class="row"><div><div class="holdername">${esc(S.holder.name)}</div><div class="name">${esc(c.name)}</div><div class="num">•••• ${esc(c.last4)}</div></div>${net}</div></div>`;
  cInfo.innerHTML=[["Card Name",c.name],["Card Number","•••• •••• •••• "+c.last4],["Finish",FINISHES[c.finish]],["Network","Mastercard"],["Transactions",String(txs.length)],["Total Spent",fmt(spent)],["Daily Cash Earned",fmt(cash)]].map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join("");
  rmCard.hidden=S.cards.length<2;
}
function openInfo(){
  renderInfo();infoPage.hidden=false;infoPage.classList.remove("leaving");appEl.classList.add("behind");
  infoPage.scrollTop=0;backBtn.focus();
}
function closeInfo(){
  appEl.classList.remove("behind");
  if(reduce){infoPage.hidden=true;return}
  infoPage.classList.add("leaving");setTimeout(()=>{infoPage.hidden=true;infoPage.classList.remove("leaving")},300);
}
infoBtn.onclick=openInfo;backBtn.onclick=closeInfo;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!infoPage.hidden&&!document.getElementById("scrim"))closeInfo()});
rmCard.onclick=()=>{
  sheet(`<div class="sheethead"><h2>Remove Card?</h2></div><p class="sub" style="margin:0">This removes the card and all its transactions from this wallet.</p><button class="primary" style="background:var(--danger);color:#fff" id="yes">Remove Card</button><button class="ghost" id="no">Cancel</button>`);
  no.onclick=()=>close();
  yes.onclick=()=>{S.tx=S.tx.filter(t=>t.card!==S.active);S.cards=S.cards.filter(c=>c.id!==S.active);S.active=S.cards[0].id;save();close(()=>{closeInfo();renderCards();renderData()})};
};
renderHolder();renderCards();renderData();
</script>

</html>
